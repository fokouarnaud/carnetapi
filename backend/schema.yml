          type: string
          format: date-time
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
      - in: query
        name: scope
        schema:
          enum:
          - global
          - personal
          type: string
          minLength: 1
