components:
  schemas:
    APIConflict:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    AbandonBackupInputRequest:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - operation_id
      - reason
    AccessLease:
      type: object
      properties:
        shop_id:
          type: string
          format: uuid
        installation_id:
          type: string
          format: uuid
        verified_at:
          type: string
          format: date-time
        offline_expires_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
        permissions:
          type: object
          additionalProperties:
            type: boolean
        seller_discount_cap_basis_points:
          type: integer
          maximum: 10000
          minimum: 0
        discount_policy_version:
          type: integer
          minimum: 1
      required:
      - discount_policy_version
      - installation_id
      - offline_expires_at
      - permissions
      - role
      - seller_discount_cap_basis_points
      - shop_id
      - verified_at
    Adjustment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        count_id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expected_milli:
          type: integer
          readOnly: true
        delta_milli:
          type: integer
          readOnly: true
        after_applied_adjustment_milli:
          type: integer
          readOnly: true
        cost:
          allOf:
          - $ref: '#/components/schemas/MovementCost'
          nullable: true
          readOnly: true
      required:
      - actor_id
      - after_applied_adjustment_milli
      - cost
      - count_id
      - created_at
      - delta_milli
      - expected_milli
      - id
      - reason
    AllocateUnallocatedRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CreateAllocationRequest'
      required:
      - allocations
      - id
      - operation_id
      - reason
    Allocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        operation_id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          format: uuid
          readOnly: true
        reason:
          type: string
          readOnly: true
        recorded_at:
          type: string
          format: date-time
          readOnly: true
        debt_id:
          type: string
          format: uuid
          readOnly: true
        amount_fcfa:
          type: integer
          readOnly: true
      required:
      - actor_id
      - amount_fcfa
      - debt_id
      - id
      - operation_id
      - reason
      - recorded_at
    AllocationInputRequest:
      type: object
      properties:
