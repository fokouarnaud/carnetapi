  /api/v1/shops/{shop_id}/recovery/operations/{id}/integrate/:
    post:
      operationId: shops_recovery_operations_integrate_create
      description: Current responsible explicitly accepts frozen source facts using
        the latest preview_token, previous_version and reason. Current rights, source
        integrity and preview are rechecked under SQLite's write reservation. A new
        sale uses its stable source operation/entity UUIDs, effective UTC date and
        frozen prices/factors. Stock, payments, unpaid debt/overpayment, cost snapshots,
        stock alerts, origin link and versioned decision commit together. The verified
        reviewer is the server writer; public actor/installation references remain
        historical source UUIDs, without creating or activating source accounts. A
        ready transfer_receipt adds only its physically received sellable quantity
        to the chosen destination products, preserving source receipt/row/movement
        UUIDs and frozen departure cost shares. The source stock is not deducted again;
        remaining transit is derived from received quantities. Receipt, stock, exact
        costs, origin and decision commit together, without cash, debt, automatic
        product selection or restored rights. Known receipts return their first acknowledgement
        after live authorization. Recovered collections preserve every real payment
        part; only originally applied allocations can reduce current debt. Remaining
        money becomes explicit unallocated credit requiring regularization, without
        automatic refund or allocation. Cash, debt, ledger, origin and review commit
        atomically. Customer/debt creations use stable source UUIDs and initial effective
        facts. Customer creation has no financial effect; opening debt adds only the
        explicit receivable and its ledger entry. Their origin and decision commit
        atomically; failures leave their raw copies intact. Matching known creations
        return their initial receipt without overwriting current contact/deadline/balance
        or fabricating missing legacy device evidence. Contact revisions change only
        declared contact fields at the exact current version. Deadline revisions change
        only the matching deadline/version and append a zero-value dated ledger entry,
        preserving current debt amounts. They retain source reason, before/after and
        origin with an atomic decision; conflicting revisions remain blocked. A ready
        customer_refund debits the chosen payment advance or sale credit by its exact
        original amount, creates one negative cash movement and one customer ledger
        entry at the source time, without reopening debt, creating a collection or
        restoring source accounts. Source/origin/reviewer/decision commit together.
        Its first acknowledgement uses current remaining credit; later copies are
        matched against preserved original source facts and never apply that refund
        again. A ready customer_allocation consumes the exact existing source credit
        and exact chosen debt amounts in its original row order. It creates a zero-net
        customer ledger entry with matching debt/credit decreases and no cash, collection,
        refund or stock. The rows, source, debts, origin and review decision commit
        together; a failure leaves all balances unchanged. Matching known allocations
        retain their first acknowledgement after later payments/refunds or another
        recovery generation. A ready return_credit_settlement consumes its existing
        return claim by the exact refund/allocation amount. Refund creates one real
        negative cash movement; allocation reduces only the chosen debts without cash.
        Customer ledger exists only for an identified sale. Its original created_at
        remains in the source snapshot; the first acknowledgement records the replay's
        created_at and current remaining claim. It creates no customer, return, physical
        receipt, stock or restored right. All effects, lineage and review commit atomically;
        known receipts survive later settlements and recovery generations. A ready
        sale_return creates the stable source return/line UUIDs, reduces only its
        own sale debt first, and creates the frozen remaining claim, with one identified
        customer ledger entry and original actor provenance. It creates no cash, refund,
        physical receipt or stock, and does not reprice historical units. Its source
        created_at is preserved in the snapshot; the acknowledgement records the replay
        creation time. Quantities, debt, return, lines, origin and decision commit
        together. Known creation receipts survive later settlements without resetting
        remaining credit. A ready return_receipt creates its original physical receipt
        and frozen cost UUID, with its retained original sale-cost reference or explicit
        legacy absence. Sellable quantity creates its deterministic stock movement
        and current stock alert observation; unsellable quantity creates no available
        stock. It creates no money, commercial return or customer ledger. Receipt,
        cost, stock, origin and decision commit together. Source creation time remains
        in the snapshot and replay creation time in its acknowledgement. Known receipts
        return their first acknowledgement after dispositions/revisions without restoring
        previous pool balances or costs. A ready non_sellable_decision consumes only
        its actual physical quantity. Restock writes its deterministic available-stock
        movement and observes alerts; supplier departure appends a zero-value supplier
        ledger trace without debt, credit, cash or automatic supplier return invoice.
        Scrap creates no second loss of available stock. The historical selected cost,
        source facts and first acknowledgement remain distinct from later current
        cost revisions and pool balances. Pool, stock, supplier trace, origin and
        decision commit atomically. Known receipts never consume the quantity again.
        A sale_cancellation commits the parent state, compensating return, own-sale
        debt decrease, remaining claim, identified ledger, distinct origins and linked
        parent/child reviews in one transaction. Child review command UUID is derived
        from this parent review; failure of either rolls back both. The response exposes
        related_integration_decision_ids. Source creation times stay in metadata and
        first acknowledgements record replay creation times. Existing child returns
        and known parent receipts are recognized without another effect. No physical
        receipt, restock, cash or automatic refund is inferred. Other operation recovery
        and blocked-conflict resolution remain to implement. Supplier creation adds
        only its stable identity. Supplier opening debt, advance and credit each append
        their separate opening position and exact supplier ledger entry, without cash,
        purchase document, goods, payment, return or automatic offset. The currently
        authorized reviewer writes the rows; journal identity/time and opening source
        creation time remain in metadata, not authentication rights. New opening acknowledgements
        record replay creation time. A matching known opening requires its preserved
        initial receipt, immutable model facts and ledger; later allocations/refunds
        never reset balances. Source, lineage, balances, ledger and review commit
        atomically. Supplier statements and opening-credit history project the historical
        actor only after shop scoping, refusing contradictory foreign lineage. Supplier
        payments create each negative cash movement once and their full unallocated
        advance with its supplier ledger. New cash UUIDs derive from stable part UUIDs;
        existing legacy cash UUIDs are retained on recognition, not rewritten. Supplier
        allocations reduce only the original chosen debts and advance by exact amounts,
        with stable source row UUIDs, one dated ledger entry and no cash or invoice.
        An otherwise sufficient changed advance yields the actual replay remainder,
        while original before/after stay in source metadata. Their first acknowledgements
        record replay time; the ledger keeps the source effective time. Source, reviewer,
        money/advance/debts, rows, lineage and decision commit atomically. Matching
        known payments/allocations require their first receipt and immutable cash/part/ledger
        facts; later allocations never reset balances. Native payment histories project
        source devices and allocation actors after scope guards; historical UUIDs
        grant no rights. Purchase documents preserve original line snapshots and source
        UUIDs, including the initial invoice debt UUID. Order, lines and lineage create
        no financial or physical effect. An invoice adds only its full original debt
        and dated ledger. Document, lines, optional debt/ledger, origin and review
        commit atomically. Matching known creation receipts remain unchanged after
        partial receipts or debt allocations; source creation time stays in metadata
        and replay creation time in its acknowledgement. A matching already committed
        sale or collection is acknowledged with no second effect. Same review command/content
        returns its original receipt after current authorization; other content or
        stale context is 409. The business_receipt is the operation's first persisted
        acknowledgement, not its target's current state. A newly recovered deadline
        acknowledgement reflects the balance at replay, not a restored historical
        balance; retries keep that acknowledgement even after later payments or revisions.
        For a pending recovered-sale review, the same transaction replaces its reservation
        with the validated movement and records the linked review decision; the available
        stock is not deducted twice. A refused review requires separate explicit regularization
        before further integration. A pending collection review is validated in the
        same transaction as its money effects, with a linked audit decision. Other
        operation families, blocked-source review, financial refusal regularization
        and recovery closure remain to implement.
