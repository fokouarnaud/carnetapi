  /api/v1/shops/{shop_id}/recovery/operations/{id}/integration-preview/:
    get:
      operationId: shops_recovery_operations_integration_preview_retrieve
      description: 'Current responsible previews one current-generation capture before
        replay. Implemented adapters: sale, customer_collection, customer_creation,
        customer_opening_debt, customer_update, customer_due_change, customer_refund,
        customer_allocation, return_credit_settlement, sale_return, return_receipt,
        non_sellable_decision, sale_cancellation, supplier_creation, supplier_opening_debt,
        supplier_opening_balance, supplier_payment, supplier_payment_allocation, purchase_order,
        purchase_invoice, purchase_receipt, transfer_receipt, product_update and pack_update.
        A purchase_receipt preserves its invoice line IDs, receipt row IDs, stock
        movement IDs, received quantities and frozen cost evidence; missing historical
        proof or charge dependencies blocks replay without substituting current costs.
        A transfer_receipt carries schema_version 1, the complete native original_request
        including transfer_id and installation_id, and its complete frozen native
        receipt. The archived departure must survive and belong to this destination
        shop. Each partial receipt retains its explicitly chosen existing destination
        product, unit, received-before quantity, movement UUID and exact allocated
        departure cost. No catalogue matching or conversion is inferred. Missing departure/product,
        inconsistent frozen costs or changed cumulative receipt context blocks application
        and requires a new explicit review. Catalogue revisions carry strict before
        and after facts with versions; conflicting current revisions remain captured
        and blocked without overwriting prices, selecting a winner or changing stock.
        A customer_creation carries original_request and customer initial ID/name/phone/version
        1/aware creation timestamps; equal contact information only produces a duplicate
        hint, never a merge. A customer_opening_debt carries original_request and
        opening_debt with full initial balance, no sale, UTC effective/deadline and
        due_version 1. Its customer/dependencies must exist first; it creates no cash
        or turnover. A customer_update supplies original_request and customer_update
        with strict before/after contact facts: the current base version and all immutable
        before fields must match, the version increases by one and only declared fields
        change. A customer_due_change supplies original_request and due_change with
        ID/customer, before/after UTC deadlines and versions, and occurred_at; it
        contains no amount or balance. Both need existing targets/dependencies; conflicts
        stay captured and block application without automatic priority or merge. current_state
        exposes only the authorized target. A customer_refund supplies original_request
        and refund with ID/customer, exactly one payment_id or credit_id, original
        before/after unallocated credit, exact amount/method/reference and occurred_at.
        It requires its source and sufficient current credit. A changed balance requires
        a new preview; the refund amount is never capped. Missing/insufficient credit
        keeps the raw refund blocked with its full proposed cash impact, pending explicit
        resolution. A customer_allocation supplies original_request and allocation
        with ID/customer, exactly one payment_id or credit_id, before/after unallocated
        credit, exact total, occurred_at and the ordered allocation ID/debt_id/amount
        list. Source and target debts must exist in this shop for the same customer.
        Repeated debts are aggregated to check capacity without merging their distinct
        row UUIDs. Insufficient credit/debt or missing dependencies blocks the whole
        operation; no partial application, new debt selection or cash effect. debt_allocation_impacts
        shows current target capacities, with null after when unavailable; global
        can_apply controls integration. Changed balances require a new preview. A
        return_credit_settlement supplies original_request and settlement with ID,
        sale/return/customer (nullable), kind, original credit before/after, amount,
        occurred_at and original created_at, method/reference and allocation list.
        Its existing return claim must belong to this shop and sale/customer. An anonymous
        claim permits refund only; allocations require identified same-customer debts
        and retain the native ban on repeated target debts. Missing references, insufficient
        claim/debt and changed context block the whole operation without stock or
        cash effects. A sale_return supplies original_request and sale_return with
        ID/sale/customer, effective and source creation UTC dates, amount, frozen
        debt reduction/credit, and line IDs, original sale-line IDs, base quantities,
        billed net totals and unit kinds. Arithmetic is checked against frozen billed
        values, never today''s catalogue. Current cumulative returned quantities must
        allow the exact source line values under cumulative half-up rounding. Current
        original-sale debt must produce the exact source debt/credit split; a changed
        financial or quantity/value context remains blocked for explicit resolution.
        A sale already cancelled blocks a new return; matching known returns remain
        acknowledgements only. Dependencies recovered later change the preview token
        and require renewed review. Already committed creations are compared against
        initial receipts, without resetting later names, deadlines or balances. Old
        native client evidence missing a device remains explicitly unverified in origin_installation_verified/notices;
        it never rebinds the original device. A collection carries original_request
        and collection with initial requested/applied allocations, parts and unallocated
        total. Each recovered allocation is capped by its original applied amount
        and today''s remaining debt, in original order. The preview shows allocation_impacts,
        real net cash by method and any unallocated excess; it never auto-settles
        other debts. For a collection, collection_review_id/review_state/review_version
        and can_mark_pending/can_refuse describe the financial review. Use the collection-review
        endpoint; can_hold remains false because no stock is reserved. A return_receipt
        carries original_request and receipt with stable receipt/sale/return/line/product
        IDs, original base unit, physical quantity/condition, effective and source
        creation times, deterministic sellable movement ID, integer legacy cost projection
        and its frozen initial exact cost (version 1, no revision, or null for legacy
        receipts). Exact large cost integers are decimal strings. Only sellable goods
        add available stock; unsellable goods remain in a separate pool. Cumulative
        physical quantities and exact cost shares must match the original sale and
        retained cost source in this shop. A missing referenced sale cost, incompatible
        cost share, missing parent/dependency or later recovery inventory adjustment
        keeps the raw copy blocked for explicit resolution. Known receipt creation
        facts remain distinct from later physical dispositions or cost revisions.
        A non_sellable_decision carries original_request and decision with the owned
        physical receipt/sale/return/line/product IDs, kind restock/supplier_return/scrap,
        original quantity and remaining pool, unit, explicit sellable confirmation,
        optional supplier, deterministic restock movement, timestamps and its historical
        exact cost version (or explicit legacy absence). Source cost versions are
        resolved only through this owned receipt. Current remaining quantity may differ
        when still sufficient and the exact original cost share remains compatible;
        the original after quantity stays in source facts and the acknowledgement
        records current remaining. Insufficient pool, missing supplier/cost/dependency,
        or incompatible cumulative rounding blocks the entire raw operation. Only
        confirmed restock adds available stock; supplier departure and scrap only
        consume this non-sellable pool, without new loss or money. A sale_cancellation
        carries original_request and cancellation with ID/sale, optional sale_return_id,
        timestamps and nullable compensating_return using the complete sale_return
        payload. Parent/child IDs, generated line IDs, actor/device/time/reason and
        frozen remainder must agree. A new compensating return also needs its own
        identical current-generation captured sale_return copy for distinct lineage;
        the parent may depend on this child internally, but the child must not depend
        on the parent. The parent preview binds the child copy, preview, versions
        and current quantities/debt. Missing copies, mismatches, another cancellation,
        later commercial returns or incompatible child finance block the whole cancellation.
        If the sale was already fully returned, no compensating return is created.
        A matching already committed child is never applied again. Supplier payload
        schema_version 1 has original_request and supplier, opening_debt or opening_balance
        for supplier_creation, supplier_opening_debt and supplier_opening_balance.
        Creation freezes id/name/phone/version 1; its journal time is a declared source
        timestamp, never invented as a proven old server creation time. No equal-contact
        merge is inferred. Openings freeze supplier ID, amount equal to initial remaining
        amount, effective and source creation times, with no invoice for debt and
        no return/reference/applied amount for opening advance or credit. The kind
        stays explicit. Missing suppliers/dependencies, future dates, conflicting
        UUIDs or source identity block replay; new_supplier_* impacts stay distinct
        from customer receivables. A supplier_payment payload carries original_request
        and payment: initial receipt IDs, supplier/device, UTC times, exact ordered
        parts and initial unallocated total equal to the full amount; allocations
        must be empty. Every actual declared part survives even if its reference is
        possibly reused. A supplier_payment_allocation payload carries original_request
        and allocation: operation/payment/supplier IDs, original before/after advance,
        recorded_at and stable allocation row IDs in original target order. Its journal
        occurred_at equals the original receipt''s recorded_at. Exact amounts must
        all fit current advance and scoped debts; no partial cap, target substitution
        or automatic cash effect. The preview binds current balances and shows supplier
        debt/advance deltas separately. Missing/foreign parents, funds, row UUID collisions
        or incompatible debts block the whole allocation. A purchase_order or purchase_invoice
        payload carries original_request and purchase: the initial native receipt
        plus supplier_id, with kind, optional order, source UTC creation/effective
        dates, exact original line IDs, names, quantities, factors, prices and totals.
        Initial received quantities are zero. Only an invoice has its full initial
        debt and stable debt UUID. Supplier, products, packs and optional same-supplier
        order must exist in this shop; current catalogue values never replace billed
        snapshots. Missing dependencies, incompatible base quantities, conflicting
        UUIDs or inconsistent totals block the whole document. An order creates no
        debt, stock or money; an invoice creates only its explicit debt and supplier
        ledger, without receipt or payment. For a sale, payload schema_version 1 carries
        original_request and a frozen sale snapshot (IDs, unit/factor/price/discount
        snapshots, payments and UTC due_at). Source arithmetic and identity are checked
        without repricing from today''s catalogue. Missing references/dependencies,
        changed base unit, UUID conflicts and later recovery inventory adjustments
        block application. No business effect is created by this read. The preview
        token binds the current context; opaque source UUIDs never create accounts.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - shops
      security:
      - deviceJWT: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryIntegrationPreview'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Missing, expired or revoked current authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Current responsible role required; historical UUIDs grant no
            rights.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Inaccessible shop, foreign capture or historical recovery generation.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Invalid frozen source arithmetic, unsupported source type or
            invalid input; the raw copy remains captured.
        '409':
          content:
