          type: integer
      - in: path
        name: shop_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: state
        schema:
          enum:
          - pending
          - refused
          - validated
          type: string
          minLength: 1
        description: |-
          * `pending` - pending
          * `refused` - refused
          * `validated` - validated
