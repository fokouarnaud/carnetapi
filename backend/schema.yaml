  /api/v1/backups/trigger/:
    post:
      operationId: backups_trigger_create
      description: Execute one daily capture or one bounded delivery step using the
        current configured technical account. The dedicated opaque bearer secret grants
        only this action, never backup listing, downloads or restoration. The body
        is empty; authority and recipient come from server configuration. Both HTTP
        and console scheduler steps hold the external maintenance barrier until SQL,
        SMTP and cleanup finish and ORM connections close. Late invocations capture
        current data once and journal missed days; incomplete archives suspend new
        automatic captures. SMTP retries remain limited to three additional attempts
        at least fifteen minutes apart.
      tags:
      - backups
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      security:
      - BackupTrigger: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerOutput'
          description: 'One bounded step. idle/disabled: no due capture; busy: another
            tick owns the scheduler lease; blocked: explicit intervention required;
            prepared/progressed: call again; accepted: SMTP acceptance; incomplete:
            retries exhausted. These states are not proof of delivery to an inbox.'
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Invalid body. No account, recipient, schedule, or backup identifier
            may be supplied.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerAuthenticationError'
          description: Missing or incorrect dedicated trigger secret. A user JWT grants
            no trigger access.
        '503':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TriggerUnavailable'
                - $ref: '#/components/schemas/ServiceUnavailable'
          description: |-
            Scheduler unavailable: invalid configuration, HTTPS required in production, current technical account unavailable, or the worker cannot acquire its normal database lease. Retry without resetting persistent run state.
            FR : Service temporairement indisponible avant authentification : maintenance ou contrôle externe indisponible. Aucun traitement métier. Réessayer après le délai indiqué, en conservant l'UUID de l'opération. EN: Temporarily unavailable before authentication: maintenance or unavailable external gate. No business processing. Retry after the indicated delay, keeping the operation UUID.
          headers:
            Retry-After:
              description: Délai en secondes / Delay in seconds
              schema:
                type: integer
                minimum: 0
              example: 30
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
