  /api/v1/shops/{shop_id}/recovery/collections-review/:
    get:
      operationId: shops_recovery_collections_review_list
      description: Current responsible reads this shop's staged collection reviews
        across generations, optionally filtered by state/customer UUID. Authorization
        and filters precede stable creation/UUID SQL pagination (25 default, 100 maximum).
        Exact FCFA totals as decimal strings cover the entire filter, separated by
        pending/refused/validated state. Totals retain original source facts, including
        originally applied/unallocated amounts; validated review totals are not current
        customer balances or all shop collections. Read business ledgers for actual
        recovered allocations/refunds. Pending/refused money is excluded from those
        validated ledgers. current_capture_id is null until a matching current-generation
        copy is deposited. Original payloads/dependencies are not loaded per row.
        Raw captures never staged, blocked copies and directly integrated operations
        remain inspectable in their respective endpoints.
