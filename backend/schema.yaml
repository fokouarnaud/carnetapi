    StatementResponse:
      type: object
      description: |-
        Explain live restoration independently from a report's historical cutoff.

        Callers must authorize the shop before passing it in serializer context.
        This metadata never changes the report's financial or stock calculations.
      properties:
        restoration:
          type: object
          nullable: true
          description: Known scoped devices are observations, not proof of exhaustive
            recovery. Null means no current restoration.
          required:
          - generation_id
          - session_id
          - state
          - snapshot_at
          - started_at
          - inventory_recorded_at
          - known_devices
          - closure_id
          - closed_at
          - missing_devices
          - historical_missing_declarations
          - missing_data
          - late_operations
          - late_review_required
          properties:
            generation_id:
              type: string
              format: uuid
            session_id:
              type: string
              format: uuid
              nullable: true
            state:
              type: string
              enum:
              - recovering
              - closed_partial
              description: A partial technical declaration never proves exhaustive
                recovery.
            snapshot_at:
              type: string
              format: date-time
              nullable: true
              description: Actual archive snapshot date, unknown for legacy metadata.
            started_at:
              type: string
              format: date-time
            inventory_recorded_at:
              type: string
              format: date-time
              nullable: true
            known_devices:
              type: integer
              minimum: 0
              nullable: true
              description: Only this shop. Null means inventory not recorded; zero
                never proves there are no unknown phones.
            closure_id:
              type: string
              format: uuid
              nullable: true
            closed_at:
              type: string
              format: date-time
              nullable: true
            missing_devices:
              type: integer
              minimum: 0
              nullable: true
              description: Unavailable device observations explicitly declared in
                this shop in the current closure; null before declaration.
            historical_missing_declarations:
              type: integer
              minimum: 0
              description: Prior declarations of missing data in this shop remain
                visible across restore generations; this is not a count of unique
                phones.
            missing_data:
              type: boolean
              nullable: true
              description: An explicit current or earlier missing-data declaration
                persists; null means no current declaration establishes completeness.
            late_operations:
              type: integer
              minimum: 0
              nullable: true
              description: This shop's append-only capture count minus its frozen
                count at closure, independent of server clock changes. Null means
                legacy or inconsistent evidence cannot establish the count; no implied
                business validation.
            late_review_required:
              type: boolean
          readOnly: true
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        as_of:
          type: string
          format: date-time
        opening_balance_fcfa:
          type: integer
        closing_balance_fcfa:
          type: integer
        closing_debt_fcfa:
          type: integer
        closing_unallocated_fcfa:
          type: integer
        pending_count:
          type: integer
        pending_delta_fcfa:
          type: integer
        provisional:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/StatementEntry'
      required:
      - as_of
      - closing_balance_fcfa
      - closing_debt_fcfa
      - closing_unallocated_fcfa
      - count
      - next
      - opening_balance_fcfa
      - pending_count
      - pending_delta_fcfa
      - previous
      - provisional
      - restoration
      - results
