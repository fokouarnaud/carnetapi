            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Missing, expired or revoked current authentication.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Current responsible role required; historical UUIDs grant no
            rights.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
          description: Inaccessible shop, foreign capture or historical recovery generation.
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: Invalid frozen source arithmetic, unsupported source type or
            invalid input; the raw copy remains captured.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryDeviceAccessError'
